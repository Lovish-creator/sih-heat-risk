version: '3.8'

services:
  app:
    build: .
    container_name: sih26083-heat-risk
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATA_MODE=hybrid
      - ENABLE_FALLBACK_DATA=true
      - DATABASE_URL=sqlite:///./data/heat_risk.db
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

